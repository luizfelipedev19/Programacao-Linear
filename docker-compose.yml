name: sistema-prog-linear

services:
  db:
    image: mysql:8.4
    container_name: projeto_linear_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      # Só a própria máquina acessa o banco; sem isso ele ficaria exposto na rede local.
      - "127.0.0.1:${MYSQL_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Scripts rodam só na primeira criação do volume (`docker compose down -v` para recriar).
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    container_name: projeto_linear_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "127.0.0.1:${BACKEND_PORT}:3000"
    # Hot reload: código montado, node_modules preservado do container.
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm run migrate && npm run dev"

volumes:
  db_data:
